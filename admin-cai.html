<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTRANET 1.17</title>
    <link rel="stylesheet" href="css/adminCai.css">
    <link rel="icon" href="imgs/iconSite.png">
</head>
<body>

    <header class="header">

        <div class="logoDiv" onclick="location.href='index.html'">
            <div class="divideLogo">
                <div class="groupLogoTexts">
                    <span class="logoText">INTRANET</span>
                    <span class="subLogoText">1.17 Mogi das Cruzes</span>
                </div>
            </div>
             <img class="logoSenai" src="imgs/logoSenai_Black.png" alt="">
        </div>

        <nav class="topNavbar">
            <hr class="separatorNav">

            <div class="navLinks">
                <p class="linkNav">Painel de Gerenciamento</p>
            </div>

        </nav>

    </header>

    <div class="backDiv">
        <div class="backButton" onclick="location.href='admin.html'"><p class="txtButton">Voltar</p></div>
    </div>

    <main class="main">

        <h1 class="title">Gerenciador de Links</h2>

            <p id="statusEdit"><strong>Editar links - CAI</strong></p>
    
        <form class="linkForm" id="linkForm">
            <input type="hidden" id="linkId">
            <input type="text" class="inputNome" id="linkNome" placeholder="Nome do Link" required>
            
            <div class="responsiveMobile">
                <div class="inputFrameUrl">
                    <img class="netIcon" src="imgs/net.png" alt=""> <hr class="separatorInputs"> <input type="text" class="inputUrl" id="linkUrl" placeholder="Endereço do link" required>
                </div>
                <button class="buttonSave" type="submit"><img class="iconSave" src="imgs/diskette.png" alt=""></button>
            </div>

            
            
        </form>
    
        <ul class="listaLinks" id="listaLinks"></ul>

    </main>



    <script src="adminCai.js"></script>
    <script src="lock.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</body>
</html>
